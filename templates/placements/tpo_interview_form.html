{% extends 'base.html' %}
{% block title %}Schedule Interview{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-transparent py-3">
                <h5 class="mb-0 fw-bold">Schedule Interview</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary fw-bold mt-3">Save Schedule</button>
                    <a href="javascript:history.back()" class="btn btn-premium btn-premium-secondary border mt-3 ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
