{% extends 'base.html' %}
{% block title %}Forgot Password | CampusConnect{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-key-fill text-primary" style="font-size: 3rem;"></i>
                    <h2 class="fw-bold mt-2 ">Forgot Password</h2>
                    <p class="text-desc">Enter your email to receive a password reset link.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-medium">Email Address</label>
                        {{ form.email }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold">Send Reset Link</button>
                </form>
                <div class="text-center mt-4 pt-2 border-top">
                    <p class="text-desc mb-0">Remembered your password? 
                        <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
