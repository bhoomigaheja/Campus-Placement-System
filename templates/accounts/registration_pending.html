{% extends 'base.html' %}
{% block title %}Verify Email | CareerConnect{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-5">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <i class="bi bi-envelope-check-fill text-primary mb-3" style="font-size: 4rem;"></i>
                <h2 class="fw-bold mt-2 ">Check Your Email</h2>
                <p class="text-desc mb-4">We've sent a verification email to <strong>{{ email }}</strong>. Please check your inbox and click the verification link to activate your account.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-lg w-100 shadow-sm fw-bold">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
