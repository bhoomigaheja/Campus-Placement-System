{% extends 'base.html' %}
{% block title %}Password Reset Complete | CareerConnect{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <i class="bi bi-check-circle-fill text-success mb-3" style="font-size: 4rem;"></i>
                <h2 class="fw-bold mt-2 ">Success!</h2>
                <p class="text-desc mb-4">Your password has been updated successfully. You can now log in with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold">Go To Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
