{% extends 'base.html' %}
{% block title %}Invalid Link | CampusConnect{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <i class="bi bi-exclamation-triangle-fill text-warning mb-3" style="font-size: 4rem;"></i>
                <h2 class="fw-bold mt-2 ">Link Expired</h2>
                <p class="text-desc mb-4">The password reset link is invalid or has expired. Please request a new one.</p>
                <a href="{% url 'forgot_password' %}" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold">Request New Link</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
