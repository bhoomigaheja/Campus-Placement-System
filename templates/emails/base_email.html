<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject|default:"CareerConnect Notification" }}</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .email-header {
            background-color: #050816;
            padding: 30px;
            text-align: center;
        }
        .email-header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .email-header h1 span {
            color: #8B5CF6;
        }
        .email-body {
            padding: 40px 30px;
        }
        .email-body h2 {
            margin-top: 0;
            color: #0F172A;
            font-size: 20px;
        }
        .email-body p {
            color: #475569;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            margin: 10px 0 20px;
            text-align: center;
        }
        .email-footer {
            background-color: #F1F5F9;
            padding: 20px 30px;
            text-align: center;
            font-size: 14px;
            color: #64748B;
        }
        .email-footer a {
            color: #8B5CF6;
            text-decoration: none;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #02040A;
                color: #FFFFFF;
            }
            .email-container {
                background-color: #0F172A;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
            .email-body h2 {
                color: #F8FAFC;
            }
            .email-body p {
                color: #CBD5E1;
            }
            .email-footer {
                background-color: #1E293B;
                color: #94A3B8;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1>Career<span>Connect</span></h1>
        </div>
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        <div class="email-footer">
            <p>Connecting Talent With Opportunity</p>
            <p>&copy; {% now "Y" %} CareerConnect. All rights reserved.</p>
            <p>Need help? Contact <a href="mailto:support@careerconnect.com">support@careerconnect.com</a></p>
        </div>
    </div>
</body>
</html>
